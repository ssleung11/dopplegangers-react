<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <link rel="icon" href="./favicon.ico" />
    <meta name="viewport" content="width=device-width,initial-scale=0.2,minimum-scale=0.3,maximum-scale=2" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Web site created using create-react-app" />
    <link rel="apple-touch-icon" href="logo192.png" />
    <link rel="manifest" href="./manifest.json" />
    <title>Dopplegangers</title>
    <link href="./static/css/main.d492e5ec.chunk.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@48,400,0,0" />
    <style>
        :root {
            --bg-deep: #0a0a0b;
            --text-primary: #ffffff;
            --text-secondary: #adadb0;
            --text-muted: #6b6b70;
            --orange-primary: #ff5c00;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden;
        }

        /* 80s Editorial Sidebar UI */
        .Overlay {
            background-color: rgba(10, 10, 11, 0.75) !important;
            /* 75% opacity */
            backdrop-filter: blur(20px);
            border-left: none !important;
            /* Remove white stroke */
            padding: 40px !important;
            display: flex;
            flex-direction: column;
            gap: 32px;
            position: fixed;
            right: 0;
            top: 0;
            width: 480px;
            height: 100vh;
            z-index: 50;
            overflow-y: auto;
        }

        /* Close Button Styling - Hide original React button entirely */
        .Overlay button {
            display: none !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }

        .Overlay button::before {
            content: 'close';
            font-family: 'Material Symbols Sharp';
            font-size: 32px;
            display: block;
        }

        .Overlay h1,
        .Overlay h2 {
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -2.5px;
            margin: 0;
            margin-top: 40px;
            /* Space for the top-left X */
            font-size: 48px;
        }

        .Overlay p {
            font-size: 13px;
            line-height: 1.5;
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* Details Button Anchored Bottom */
        #details-link {
            position: fixed;
            bottom: 40px;
            right: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 46px;
            padding: 0 24px;
            border: 1px solid var(--text-muted);
            background: rgba(0, 0, 0, 0.8);
            color: var(--text-primary);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            z-index: 100;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
            box-sizing: border-box;
        }

        #details-link:hover {
            border-color: var(--text-primary);
            background: var(--text-primary);
            color: black;
        }

        /* Hide the specific link */
        .Overlay a[href="about.html"] {
            display: none !important;
        }
    </style>
</head>

<body><noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <a href="about.html" id="details-link">View Project Details</a>

    <script>
        // Use a MutationObserver to ensure we catch the Overlay whenever it's rendered by React
        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if (mutation.addedNodes.length) {
                    const overlay = document.querySelector('.Overlay');
                    if (overlay) {
                        // Remove "About Project" links if they sneak in
                        const links = overlay.querySelectorAll('a');
                        links.forEach(link => {
                            if (link.textContent.includes('About Project')) {
                                link.style.display = 'none';
                            }
                        });

                        // Extract and move the close button to the body to ensure it stays on the far left (40px)
                        // since backdrop-filter on .Overlay creates a new coordinate system.
                        const btn = overlay.querySelector('button');
                        if (btn && !document.getElementById('global-close-btn')) {
                            // Hide the original button so React doesn't get confused, 
                            // but we'll use its functionality.
                            btn.style.display = 'none';

                            const globalBtn = document.createElement('button');
                            globalBtn.id = 'global-close-btn';
                            globalBtn.innerHTML = '<span class="material-symbols-sharp">close</span>';

                            // Apply styles to anchor it to the top-right (10px right, 5px up from previous position)
                            Object.assign(globalBtn.style, {
                                position: 'fixed',
                                top: '15px',
                                right: '10px',
                                left: 'auto',
                                background: 'none',
                                border: 'none',
                                color: 'white',
                                cursor: 'pointer',
                                zIndex: '1000'
                            });

                            globalBtn.onclick = () => {
                                btn.click(); // Trigger the original React close logic
                                globalBtn.remove();
                            };

                            document.body.appendChild(globalBtn);
                        }
                    }
                } else if (mutation.removedNodes.length) {
                    // Cleanup the global button if the overlay is removed by other means
                    if (!document.querySelector('.Overlay')) {
                        const globalBtn = document.getElementById('global-close-btn');
                        if (globalBtn) globalBtn.remove();
                    }
                }
            });
        });

        observer.observe(document.body, { childList: true, subtree: true });

        // Add Escape key support for the React Overlay
        window.addEventListener('keydown', function (event) {
            if (event.key === 'Escape' || event.key === 'Esc') {
                const closeBtn = document.querySelector('.Overlay button') || document.getElementById('global-close-btn');
                if (closeBtn) {
                    closeBtn.click();
                }
            }
        });
    </script>

    <script src="./static/js/main.078a078c.chunk.js"></script>
</body>

</html>
